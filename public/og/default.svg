<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Aurora bloom gradient -->
    <radialGradient id="aurora1" cx="0.18" cy="0.15" r="0.7">
      <stop offset="0%" stop-color="#FF6363" stop-opacity="0.42"/>
      <stop offset="60%" stop-color="#FF6363" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="0.85" cy="0.85" r="0.6">
      <stop offset="0%" stop-color="#FF8A6B" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#FF8A6B" stop-opacity="0"/>
    </radialGradient>

    <!-- Headline accent gradient (peach → red) -->
    <linearGradient id="accentText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFA48A"/>
      <stop offset="100%" stop-color="#FF6363"/>
    </linearGradient>

    <!-- Subtle dotted grid pattern -->
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>

    <!-- Logo dot glow filter -->
    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base dark background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>

  <!-- Dotted grid layer -->
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Aurora blooms (layered) -->
  <rect width="1200" height="630" fill="url(#aurora1)"/>
  <rect width="1200" height="630" fill="url(#aurora2)"/>

  <!-- Hairline border (subtle) -->
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none"
        stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- LOGO MARK: red square + wordmark -->
  <g transform="translate(80, 80)">
    <rect width="22" height="22" rx="4" fill="#FF6363" filter="url(#dotGlow)"/>
    <text x="36" y="18"
          font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
          font-size="20" font-weight="700"
          fill="#F5F5F7"
          letter-spacing="-0.4">Pillexis Labs</text>
  </g>

  <!-- EYEBROW PILL -->
  <g transform="translate(80, 192)">
    <rect width="240" height="32" rx="16" fill="#FF6363" fill-opacity="0.10"
          stroke="#FF6363" stroke-opacity="0.32" stroke-width="1"/>
    <circle cx="18" cy="16" r="3.5" fill="#FF6363" filter="url(#dotGlow)"/>
    <text x="32" y="21"
          font-family="'JetBrains Mono', monospace"
          font-size="11" font-weight="500"
          fill="#FF6363"
          letter-spacing="2.2">A PRODUCT STUDIO, AS A LAB</text>
  </g>

  <!-- HEADLINE -->
  <text x="80" y="320"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="86" font-weight="800"
        fill="#F5F5F7"
        letter-spacing="-4">AI builds almost</text>
  <text x="80" y="416"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="86" font-weight="800"
        fill="#F5F5F7"
        letter-spacing="-4">everything.</text>
  <text x="80" y="512"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="86" font-weight="800"
        fill="url(#accentText)"
        font-style="italic"
        letter-spacing="-4">We find what it can't.</text>

  <!-- BOTTOM URL TAG -->
  <g transform="translate(80, 562)">
    <text font-family="'JetBrains Mono', monospace"
          font-size="14" font-weight="500"
          fill="#6E6E73"
          letter-spacing="2">PILLEXISLABS.COM</text>
  </g>

  <!-- BOTTOM-RIGHT META -->
  <g transform="translate(1120, 562)" text-anchor="end">
    <text font-family="'JetBrains Mono', monospace"
          font-size="14" font-weight="500"
          fill="#6E6E73"
          letter-spacing="2">FREE TOOLS · STUDIO · SPRINTS</text>
  </g>
</svg>
