<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="warmGlow" cx="0.86" cy="0.14" r="0.74">
      <stop offset="0%" stop-color="#f6b2a5" stop-opacity="0.5"/>
      <stop offset="64%" stop-color="#f6b2a5" stop-opacity="0"/>
    </radialGradient>
    <filter id="markGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#f5f1ee"/>
  <rect width="1200" height="630" fill="url(#warmGlow)"/>

  <g transform="translate(72, 68)">
    <rect width="22" height="22" rx="5" fill="#d94850" filter="url(#markGlow)"/>
    <text x="36" y="20"
          font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif"
          font-size="28" font-weight="600"
          fill="#201a1c"
          letter-spacing="-0.6">Pillexis Labs</text>
  </g>

  <text x="72" y="148"
        font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="22" font-weight="500"
        fill="#d94850"
        letter-spacing="0.2">AI native product and engineering studio</text>

  <text x="72" y="230"
        font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="54" font-weight="600"
        fill="#201a1c"
        letter-spacing="-1.8">
    <tspan x="72" dy="0">Pillexis Labs is an AI native product</tspan>
    <tspan x="72" dy="63">and engineering studio that helps</tspan>
    <tspan x="72" dy="63">businesses turn complex operations</tspan>
    <tspan x="72" dy="63">and fragmented tools into custom</tspan>
    <tspan x="72" dy="63" fill="#d94850">software they own.</tspan>
  </text>

  <line x1="72" y1="560" x2="1128" y2="560" stroke="#d8cfca" stroke-width="1"/>
  <text x="72" y="598"
        font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="18" font-weight="500"
        fill="#d94850">pillexislabs.com</text>
  <text x="1128" y="598" text-anchor="end"
        font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="18" font-weight="400"
        fill="#756d69">Fixed scope. Code in your GitHub from day one.</text>
</svg>
