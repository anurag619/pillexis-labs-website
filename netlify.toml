[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  PUBLIC_FB_PIXEL_ID = "1548597113625938"
  PUBLIC_GA_ID = "G-VJFFZCJNEC"

# SPA-style fallback isn't needed (static site). Astro outputs
# proper HTML per route.

[[redirects]]
  from = "/legacy/*"
  to = "/404"
  status = 404

[[redirects]]
  from = "/work-with-us"
  to = "/"
  status = 301

[[redirects]]
  from = "/work-with-us/"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
