[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  PUBLIC_FB_PIXEL_ID = "1548597113625938"
  PUBLIC_GA_ID = "G-VJFFZCJNEC"

# Netlify Functions live alongside the static site. esbuild bundles each
# .ts function (auto-detected). Secrets (META_CAPI_ACCESS_TOKEN,
# CAL_WEBHOOK_SECRET) must be set in the Netlify UI, NOT here.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA-style fallback isn't needed (static site). Astro outputs
# proper HTML per route.

[[redirects]]
  from = "/legacy/*"
  to = "/404"
  status = 404

# Cleaner public URL for the Cal.com webhook. Both paths resolve to the
# same function — give Cal.com whichever is easier.
[[redirects]]
  from = "/api/cal-booking"
  to = "/.netlify/functions/cal-booking"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
